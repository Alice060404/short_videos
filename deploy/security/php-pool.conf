[short-videos]
user = svparser
group = svparser
listen = /run/php/short-videos.sock
listen.owner = www-data
listen.group = www-data
listen.backlog = 16
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 15s
pm.max_requests = 200
request_terminate_timeout = 35s
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[allow_url_fopen] = off
php_admin_value[memory_limit] = 96M
php_admin_value[max_execution_time] = 25
php_admin_value[default_socket_timeout] = 10
php_admin_value[cgi.fix_pathinfo] = 0
php_admin_value[post_max_size] = 16K
php_admin_value[upload_max_filesize] = 1K
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec
php_admin_value[sys_temp_dir] = /tmp/short-videos
php_admin_value[session.save_path] = /tmp/short-videos
php_admin_value[open_basedir] = /var/www/short-videos:/etc/short-videos:/tmp/short-videos:/etc/ssl/certs:/usr/share/zoneinfo
security.limit_extensions = .php
